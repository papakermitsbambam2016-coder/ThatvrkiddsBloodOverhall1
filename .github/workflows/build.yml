name: Build ScratchLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Check project files
        run: |
          echo "Working directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Restore
        run: dotnet restore ./ScratchLab.csproj

      - name: Build
        run: dotnet build ./ScratchLab.csproj --configuration Release --no-restore

      - name: Check DLL
        run: |
          echo "Built DLL:"
          find . -type f -name "ScratchLab.dll" -print

      - name: Upload ScratchLab DLL
        uses: actions/upload-artifact@v4
        with:
          name: ScratchLab-DLL
          path: ./bin/Release/net6.0/ScratchLab.dll
          if-no-files-found: error

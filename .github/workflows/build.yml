name: Build ScratchLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Find and restore project
        shell: bash
        run: |
          echo "Looking for ScratchLab.csproj..."
          find "$GITHUB_WORKSPACE" -type f -name "ScratchLab.csproj" -print

          PROJECT=$(find "$GITHUB_WORKSPACE" -type f -name "ScratchLab.csproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ScratchLab.csproj was not found."
            exit 1
          fi

          echo "Found: $PROJECT"
          dotnet restore "$PROJECT"

      - name: Build
        shell: bash
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE" -type f -name "ScratchLab.csproj" -print -quit)
          dotnet build "$PROJECT" --configuration Release --no-restore

      - name: Upload ScratchLab.dll
        uses: actions/upload-artifact@v4
        with:
          name: ScratchLab
          path: "**/bin/Release/**/ScratchLab.dll"

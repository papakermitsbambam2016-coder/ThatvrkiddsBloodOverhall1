name: Build ScratchLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Check ScratchLab.csproj
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "File listing:"
          ls -la

          echo ""
          echo "Project file details:"
          ls -lb ./ScratchLab.csproj

          echo ""
          echo "File information:"
          file ./ScratchLab.csproj

          echo ""
          echo "Project file contents:"
          head -20 ./ScratchLab.csproj

          echo ""
          echo "Absolute path:"
          realpath ./ScratchLab.csproj

      - name: Restore
        run: |
          PROJECT="$(realpath ./ScratchLab.csproj)"
          echo "Restoring: $PROJECT"
          dotnet restore "$PROJECT"

      - name: Build
        run: |
          PROJECT="$(realpath ./ScratchLab.csproj)"
          dotnet build "$PROJECT" --configuration Release --no-restore.



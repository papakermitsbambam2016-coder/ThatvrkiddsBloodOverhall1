name: Build ScratchLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Check repository files
        run: |
          echo "Working directory:"
          pwd
          echo ""
          echo "Project files:"
          find . -type f -name "*.csproj" -print

      - name: Restore
        run: dotnet restore ./ScratchLab.csproj

      - name: Build
        run: dotnet build ./ScratchLab.csproj --configuration Release --no-restore

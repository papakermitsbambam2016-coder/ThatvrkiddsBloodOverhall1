name: Build ScratchLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Find project
        shell: bash
        run: |
          echo "Looking for project files..."

          find "$GITHUB_WORKSPACE" -type f -name "*.csproj" -print

          PROJECT=$(find "$GITHUB_WORKSPACE" -type f -name "*.csproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "No .csproj file found."
            exit 1
          fi

          echo "Using project:"
          printf '<%s>\n' "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Restore
        run: |
          echo "Restoring:"
          printf '<%s>\n' "$PROJECT"
          dotnet restore "$PROJECT"

      - name: Build
        run: |
          echo "Building:"
          printf '<%s>\n' "$PROJECT"
          dotnet build "$PROJECT" --configuration Release --no-restore

      - name: Show generated DLL
        run: |
          echo "Looking for generated DLL..."
          find "$GITHUB_WORKSPACE" -type f -name "ScratchLab.dll" -print
      - name: Show generated DLL
        run: |
          echo "Looking for generated DLL..."
          find "$GITHUB_WORKSPACE" -type f -name "ScratchLab.dll" -print

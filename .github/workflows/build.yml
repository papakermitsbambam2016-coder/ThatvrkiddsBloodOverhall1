name: Build ScratchLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Locate project
        id: locate
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f -print

          PROJECT=$(find . -maxdepth 3 -type f -name "ScratchLab.csproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ScratchLab.csproj was NOT found."
            exit 1
          fi

          echo "Found project: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.locate.outputs.project }}"

      - name: Build
        run: dotnet build "${{ steps.locate.outputs.project }}" --configuration Release --no-restore

      - name: Upload ScratchLab.dll
        uses: actions/upload-artifact@v4
        with:
          name: ScratchLab
          path: "**/bin/Release/**/ScratchLab.dll"
